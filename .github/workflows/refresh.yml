name: Refresh dashboard (every 30 minutes)

on:
  schedule:
    # GitHub delays or skips schedules at busy moments (the start of each hour and half hour), so run at quiet minutes
    - cron: "12,42 * * * *"
  workflow_dispatch:

concurrency:
  group: dashboard
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Build the live numbers (current week and last week)
        if: hashFiles('data/history.json') != ''
        env:
          GA4_KEY_JSON: ${{ secrets.GA4_KEY_JSON }}
          PIPEDRIVE_TOKEN: ${{ secrets.PIPEDRIVE_TOKEN }}
        run: python3 scripts/build_data.py --mode live
      - name: Publish to Cloudflare Pages
        if: hashFiles('data/history.json') != ''
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx --yes wrangler@3 pages deploy site --project-name=klenty-web-dashboard --branch=main
