name: Full recalculation (once a day, also the first run)

on:
  schedule:
    - cron: "30 20 * * *"   # 02:00 India time
  workflow_dispatch:

concurrency:
  group: dashboard
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  full:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - name: Recalculate every week, including engagement
        env:
          GA4_KEY_JSON: ${{ secrets.GA4_KEY_JSON }}
          PIPEDRIVE_TOKEN: ${{ secrets.PIPEDRIVE_TOKEN }}
        run: python3 scripts/build_data.py --mode full
      - name: Save the history file (numbers only, no personal data)
        run: |
          git config user.name "dashboard-bot"
          git config user.email "dashboard-bot@users.noreply.github.com"
          git add data/history.json
          git commit -m "Update dashboard history" || echo "nothing to commit"
          git push
      - name: Publish to Cloudflare Pages
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx --yes wrangler@3 pages deploy site --project-name=klenty-web-dashboard --branch=main
